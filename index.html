<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetLog Driver App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--light); margin: 0; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: var(--dark); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn-login { background: var(--primary); color: white; }
        .btn-start { background: var(--success); color: white; }
        .btn-end { background: var(--danger); color: white; }
        .btn-night { background: #64748b; color: white; }
        .btn-night.active { background: #8b5cf6; border: 3px solid #4c1d95; }
        .status-badge { text-align: center; font-weight: bold; padding: 10px; border-radius: 5px; margin-top: 10px; background: #e2e8f0; }
        #driver-ui { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <h1>FleetLog</h1>

    <div id="login-ui" class="card">
        <input type="email" id="email" placeholder="Driver Email">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="handleLogin()">Driver Login</button>
    </div>

    <div id="driver-ui">
        <div class="card">
            <h3 id="welcome-text">Welcome</h3>
            <div id="status" class="status-badge">Off Duty</div>
            
            <button id="start-btn" class="btn-start" onclick="logAction('Start Shift')">Start Shift</button>
            
            <button id="night-btn" class="btn-night" onclick="toggleNightOut()">Night Out: OFF</button>
            
            <button id="end-btn" class="btn-end" onclick="logAction('End Shift')">End Shift</button>
        </div>
        <p id="msg" style="text-align: center; color: #64748b; font-size: 14px;"></p>
    </div>
</div>

<script>
    // Configuration
    const SUPABASE_URL = "https://mbudwnwxucluwgbkgbfx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1idWR3bnd4dWNsdXdnYmtnYmZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDQwMjYsImV4cCI6MjA5MDc4MDAyNn0.xFv-FiQ894vdfJuQYWQyF4WzQXmlnmnKvz_c8nuzl5Q";
    const GOOGLE_MAPS_KEY = "AIzaSyDOPkYduNBvti4HWX2izIhCrrQ02uk5SL0";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let isNightOut = false;
    let currentUser = null;

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            alert(error.message);
        } else {
            currentUser = data.user;
            document.getElementById('login-ui').classList.add('hidden');
            document.getElementById('driver-ui').style.display = 'block';
            document.getElementById('welcome-text').innerText = `Driver: ${currentUser.email}`;
        }
    }

    function toggleNightOut() {
        isNightOut = !isNightOut;
        const btn = document.getElementById('night-btn');
        btn.classList.toggle('active');
        btn.innerText = isNightOut ? "Night Out: ON" : "Night Out: OFF";
    }

    async function logAction(actionType) {
        const msgDiv = document.getElementById('msg');
        msgDiv.innerText = "Getting location...";

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser");
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const { latitude, longitude } = position.coords;
            
            // Get Address from Google Maps
            try {
                const response = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=${GOOGLE_MAPS_KEY}`);
                const geoData = await response.json();
                const address = geoData.results[0]?.formatted_address || "Unknown Location";

                // Save to Supabase
                const { error } = await _supabase
                    .from('shift_logs')
                    .insert([{
                        driver_name: currentUser.email,
                        action: actionType,
                        day_name: new Date().toLocaleDateString('en-GB', { weekday: 'long' }),
                        location: address,
                        lat: latitude,
                        lng: longitude,
                        is_night_out: isNightOut
                    }]);

                if (error) throw error;

                document.getElementById('status').innerText = actionType === 'Start Shift' ? 'On Duty' : 'Off Duty';
                msgDiv.innerText = `Last Log: ${actionType} at ${new Date().toLocaleTimeString()}`;
                
                if(actionType === 'End Shift') {
                    // Reset Night out toggle after shift ends
                    if(isNightOut) toggleNightOut();
                }

            } catch (err) {
                console.error(err);
                alert("Error logging data. Check console.");
            }
        });
    }
</script>

</body>
</html>
